name: Build Beta

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      JAVA_VERSION: '21'
      BASE_PROJECT_VERSION: ""
      PROJECT_VERSION: ""
      BUILD_NUMBER: 0
      GAME_VERSIONS: ""
      GAME_VERSIONS_JSON: ""
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      USER_GITHUB: ${{ secrets.USER_GITHUB }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
      POLYMART_TOKEN: ${{ secrets.POLYMART_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read version and game versions
        shell: bash
        run: |
          set -euo pipefail
          BASE_PROJECT_VERSION=$(grep -Po 'baseVersion\s*=\s*"\K[^"]+' build.gradle.kts)
          echo "BASE_PROJECT_VERSION=$BASE_PROJECT_VERSION" >> "$GITHUB_ENV"

          # Supported Minecraft versions for this build. Keep in sync with
          # the twin copy in build-release.yml and with the api-version floor
          # in plugin/src/main/resources/plugin.yml.
          GAME_VERSIONS=$(printf '%s\n' \
            1.20.5 \
            1.20.6 \
            1.21 \
            1.21.1 \
            1.21.2 \
            1.21.3 \
            1.21.4 \
            1.21.5 \
            1.21.6 \
            1.21.7 \
            1.21.8 \
            1.21.9 \
            1.21.10 \
            1.21.11)
          echo "GAME_VERSIONS<<EOF" >> "$GITHUB_ENV"
          echo "$GAME_VERSIONS" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

          # Create JSON array for Hangar platform_dependencies (compact single-line format)
          GAME_VERSIONS_JSON=$(echo "$GAME_VERSIONS" | jq -R . | jq -sc .)
          echo "GAME_VERSIONS_JSON=$GAME_VERSIONS_JSON" >> "$GITHUB_ENV"

      - name: Compute beta BUILD_NUMBER from GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          : "${BASE_PROJECT_VERSION?Missing BASE_PROJECT_VERSION}"

          # List existing release tag names, strip quotes, and normalize optional leading 'v'
          LINES=$(gh release list --limit 200 --json tagName --jq '.[].tagName' | tr -d '"' || true)
          LINES=$(printf '%s\n' "$LINES" | sed -E 's/^v//' )

          # Match exact tags like "<version>-beta-NN"
          CANDS=$(printf '%s\n' "$LINES" | grep -E "^${BASE_PROJECT_VERSION}-beta-[0-9]+$" || true)
          NUMS=$(printf '%s\n' "$CANDS" | sed -E "s/^${BASE_PROJECT_VERSION}-beta-([0-9]+)$/\1/" || true)
          MAX_B=$(printf '%s\n' "${NUMS:-}" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          [[ -z "${MAX_B:-}" ]] && MAX_B=0

          BUILD_NUMBER=$((MAX_B + 1))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          PROJECT_VERSION="${BASE_PROJECT_VERSION}-beta-$(printf '%02d' $BUILD_NUMBER)"
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"
          echo "Building version: $PROJECT_VERSION"

      - name: Read changelog
        id: changelog
        shell: bash
        run: |
          CHANGELOG_FILE=".github/changelogs/${BASE_PROJECT_VERSION}-beta.md"
          if [[ -f "$CHANGELOG_FILE" ]]; then
            echo "Found changelog: $CHANGELOG_FILE"
            {
              echo 'content<<EOF'
              cat "$CHANGELOG_FILE"
              echo ""
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "No changelog found at $CHANGELOG_FILE, using default message"
            echo "content=Beta build. **Test before using in production.**" >> "$GITHUB_OUTPUT"
          fi

      - name: Build MyPet
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          ./gradlew --no-daemon --build-cache build -PbuildType=beta -PBUILD_NUMBER=${BUILD_NUMBER} -PUSER_GITHUB=${USER_GITHUB} -PTOKEN_GITHUB=${TOKEN_GITHUB}

      - name: Publish API snapshot to Reposilite
        run: ./gradlew --no-daemon :api:publish -PbuildType=beta
        env:
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}

      - name: Find JAR
        id: findjar
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/MyPet-${PROJECT_VERSION}.jar"
          if [[ ! -f "$JAR" ]]; then
            echo "Expected jar not found: $JAR" >&2
            ls -la build/libs || true
            exit 1
          fi
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "Found: $JAR"

      - name: Upload workflow artifact (jar)
        uses: actions/upload-artifact@v4
        with:
          name: mypet-beta-jar
          path: ${{ steps.findjar.outputs.jar }}
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PROJECT_VERSION }}
          name: v${{ env.PROJECT_VERSION }}
          prerelease: true
          files: ${{ steps.findjar.outputs.jar }}
          body: |
            ${{ steps.changelog.outputs.content }}

      - name: Publish to Hangar
        continue-on-error: true
        env:
          HANGAR_TOKEN: ${{ env.HANGAR_TOKEN }}
          HANGAR_CHANGELOG: ${{ steps.changelog.outputs.content }}
        run: |
          ./gradlew --no-daemon publishPluginPublicationToHangar

      - name: Upload to Modrinth
        continue-on-error: true
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: SnE2iTno
          channel: beta
          featured: false
          name: ${{ env.PROJECT_VERSION }}
          version: ${{ env.PROJECT_VERSION }}
          changelog: ${{ steps.changelog.outputs.content }}
          loaders: paper
          game-versions: ${{ env.GAME_VERSIONS }}
          files: ${{ steps.findjar.outputs.jar }}

      - name: Upload to Polymart
        continue-on-error: true
        run: |
          ./gradlew --no-daemon createPolymartRelease \
            -PPOLYMART_TOKEN=${POLYMART_TOKEN} \
            -PPOLYMART_VERSION=${PROJECT_VERSION} \
            -PPOLYMART_FILE=${{ steps.findjar.outputs.jar }}

      - name: Send a Discord webhook notification
        shell: bash
        env:
          CHANGELOG: ${{ steps.changelog.outputs.content }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n \
            --arg version "$PROJECT_VERSION" \
            --arg changelog "$CHANGELOG" \
            --arg actor "${{ github.actor }}" \
            --arg actor_id "${{ github.actor_id }}" \
            '{
              username: "MyPet Beta",
              content: "<@&1431929679626895450>",
              embeds: [
                {
                  type: "rich",
                  title: $version,
                  description: ("New beta released. **Test before using in production.**\n\n" + $changelog),
                  color: 16761095,
                  thumbnail: {
                    url: "https://raw.githubusercontent.com/MyPetORG/MyPet/master/.github/readme-images/logo.png"
                  },
                  author: {
                    name: $actor,
                    url: ("https://github.com/" + $actor),
                    icon_url: ("https://avatars.githubusercontent.com/u/" + $actor_id + "?v=4")
                  },
                  url: ("https://github.com/MyPetORG/MyPet/releases/tag/" + $version)
                }
              ]
            }')
          RESPONSE=$(curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK_URL")
          echo "Webhook server response: $RESPONSE"
