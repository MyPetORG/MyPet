name: Build Development Snapshot

on:
  push:
    branches: [ development, v4 ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      JAVA_VERSION: '21'
      BASE_PROJECT_VERSION: ""
      PROJECT_VERSION: ""
      BUILD_NUMBER: 0
      GAME_VERSIONS: ""
      GAME_VERSIONS_JSON: ""
      CHANGELOG: ""
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      USER_GITHUB: ${{ secrets.USER_GITHUB }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
      POLYMART_TOKEN: ${{ secrets.POLYMART_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read version and game versions
        shell: bash
        run: |
          set -euo pipefail
          BASE_PROJECT_VERSION=$(grep -Po 'baseVersion\s*=\s*"\K[^"]+' build.gradle.kts)
          echo "BASE_PROJECT_VERSION=$BASE_PROJECT_VERSION" >> "$GITHUB_ENV"

          # Extract Minecraft versions from versionmatcher.csv (first column)
          GAME_VERSIONS=$(cut -d',' -f1 src/main/resources/versionmatcher.csv | grep -v '^$' | paste -sd $'\n' -)
          echo "GAME_VERSIONS<<EOF" >> "$GITHUB_ENV"
          echo "$GAME_VERSIONS" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

          # Create JSON array for Hangar platform_dependencies (compact single-line format)
          GAME_VERSIONS_JSON=$(cut -d',' -f1 src/main/resources/versionmatcher.csv | grep -v '^$' | jq -R . | jq -sc .)
          echo "GAME_VERSIONS_JSON=$GAME_VERSIONS_JSON" >> "$GITHUB_ENV"

      - name: Ensure PR to master exists with release title
        continue-on-error: true
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: master
        shell: bash
        run: |
          set -euo pipefail
          : "${BASE_PROJECT_VERSION?Missing BASE_PROJECT_VERSION}"
          TITLE="Release (${BASE_PROJECT_VERSION})"

          # Skip if on base branch
          if [[ "$HEAD_BRANCH" == "$BASE_BRANCH" ]]; then
            echo "On $BASE_BRANCH; nothing to do."; exit 0
          fi

          OWNER_REPO="${GITHUB_REPOSITORY}"
          OWNER="${OWNER_REPO%%/*}"

          echo "Checking for existing open PR from $HEAD_BRANCH to $BASE_BRANCH"
          PR_NUMBER=$(gh pr list \
            --state open \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --json number \
            --jq '.[0].number' || true)

          if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; then
            PR_NUMBER=$(gh pr list \
              --state open \
              --base "$BASE_BRANCH" \
              --head "$OWNER:$HEAD_BRANCH" \
              --json number \
              --jq '.[0].number' || true)
          fi

          if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; then
            echo "No open PR found. Creating one with title: $TITLE"
            BODY=$(cat <<'EOF'
          This pull request was automatically created by the snapshot build to keep master up to date with development.
          EOF
            )
            # Try unqualified head first, then qualified
            if ! gh pr create --base "$BASE_BRANCH" --head "$HEAD_BRANCH" --title "$TITLE" --body "$BODY"; then
              gh pr create --base "$BASE_BRANCH" --head "$OWNER:$HEAD_BRANCH" --title "$TITLE" --body "$BODY"
            fi
          else
            echo "Open PR #$PR_NUMBER exists. Ensuring title is set to: $TITLE"
            gh pr edit "$PR_NUMBER" --title "$TITLE" || echo "Warning: failed to update PR title"
          fi

      - name: Compute snapshot BUILD_NUMBER from GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          : "${BASE_PROJECT_VERSION?Missing BASE_PROJECT_VERSION}"

          # List existing release tag names, strip quotes, and normalize optional leading 'v'
          LINES=$(gh release list --limit 200 --json tagName --jq '.[].tagName' | tr -d '"' || true)
          LINES=$(printf '%s\n' "$LINES" | sed -E 's/^v//' )

          # Match exact tags like "<version>-SNAPSHOT-bNN"
          CANDS=$(printf '%s\n' "$LINES" | grep -E "^${BASE_PROJECT_VERSION}-SNAPSHOT-b[0-9]+$" || true)
          NUMS=$(printf '%s\n' "$CANDS" | sed -E "s/^${BASE_PROJECT_VERSION}-SNAPSHOT-b([0-9]+)$/\1/" || true)
          MAX_B=$(printf '%s\n' "${NUMS:-}" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          [[ -z "${MAX_B:-}" ]] && MAX_B=0

          BUILD_NUMBER=$((MAX_B + 1))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          PROJECT_VERSION="${BASE_PROJECT_VERSION}-SNAPSHOT-b${BUILD_NUMBER}"
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"
          echo "Building version: $PROJECT_VERSION"

      - name: Generate changelog
        shell: bash
        run: |
          set -euo pipefail
          # Get the previous snapshot tag
          PREV_TAG=$(gh release list --limit 20 --json tagName,isPrerelease -q '.[] | select(.isPrerelease) | .tagName' | head -1 || echo "")
          if [[ -n "$PREV_TAG" && "$PREV_TAG" != "null" ]]; then
            CHANGELOG=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="${PROJECT_VERSION}" \
              -f target_commitish="${{ github.sha }}" \
              -f previous_tag_name="${PREV_TAG}" \
              -q '.body' || echo "Snapshot ${PROJECT_VERSION}")
          else
            CHANGELOG="Snapshot ${PROJECT_VERSION}"
          fi
          echo "CHANGELOG<<EOF" >> "$GITHUB_ENV"
          echo "$CHANGELOG" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Build MyPet
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          ./gradlew --no-daemon build -PBUILD_NUMBER=${BUILD_NUMBER} -PUSER_GITHUB=${USER_GITHUB} -PTOKEN_GITHUB=${TOKEN_GITHUB}

      - name: Find JAR
        id: findjar
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/MyPet-${PROJECT_VERSION}.jar"
          if [[ ! -f "$JAR" ]]; then
            echo "Expected jar not found: $JAR" >&2
            ls -la build/libs || true
            exit 1
          fi
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "Found: $JAR"

      - name: Upload workflow artifact (jar)
        uses: actions/upload-artifact@v4
        with:
          name: mypet-snapshot-jar
          path: ${{ steps.findjar.outputs.jar }}
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PROJECT_VERSION }}
          name: v${{ env.PROJECT_VERSION }}
          generate_release_notes: true
          prerelease: true
          files: ${{ steps.findjar.outputs.jar }}

      - name: Upload to Hangar
        uses: benwoo1110/hangar-upload-action@v1
        with:
          api_token: ${{ env.HANGAR_TOKEN }}
          slug: 'MyPet'
          version: ${{ env.PROJECT_VERSION }}
          channel: snapshot
          description: ${{ env.CHANGELOG }}
          files: |
            [
              {
                "path": "${{ steps.findjar.outputs.jar }}",
                "platforms": ["PAPER"]
              }
            ]
          platform_dependencies: |
            {
              "PAPER": ${{ env.GAME_VERSIONS_JSON }}
            }

      - name: Upload to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: SnE2iTno
          channel: alpha
          featured: false
          name: ${{ env.PROJECT_VERSION }}
          version: ${{ env.PROJECT_VERSION }}
          changelog: ${{ env.CHANGELOG }}
          loaders: paper
          game-versions: ${{ env.GAME_VERSIONS }}
          files: ${{ steps.findjar.outputs.jar }}

      - name: Upload to Polymart
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -s -X POST "https://api.polymart.org/v1/postUpdate" \
            -F "api_key=${{ env.POLYMART_TOKEN }}" \
            -F "resource_id=8915" \
            -F "version=${{ env.PROJECT_VERSION }}" \
            -F "snapshot=1" \
            -F "title=v${{ env.PROJECT_VERSION }}" \
            -F "message=${{ env.CHANGELOG }}" \
            -F "file=@${{ steps.findjar.outputs.jar }}")
          echo "Polymart response: $RESPONSE"
          if echo "$RESPONSE" | jq -e '.response.success' > /dev/null 2>&1; then
            echo "Upload successful"
          else
            echo "Upload may have failed, check response above"
            exit 1
          fi

      - name: Send a Discord webhook notification
        run: |
          RESPONSE=$(curl -H "Content-Type: application/json" -X POST -d '{
          "username": "MyPet Snapshot",
          "content": "<@&1431929679626895450>",
          "embeds": [
            {
              "type": "rich",
              "title": "${{ env.PROJECT_VERSION }}",
              "description": "New snapshot published",
              "color": 439741,
              "thumbnail": {
                "url": "https://raw.githubusercontent.com/MyPetORG/MyPet/master/.github/readme-images/logo.png"
              },
              "author": {
                "name": "${{ github.actor }}",
                "url": "https://github.com/${{ github.actor_id }}",
                "icon_url": "https://avatars.githubusercontent.com/u/${{ github.actor_id }}?v=4"
              },
              "url": "https://github.com/MyPetORG/MyPet/releases/tag/${{ env.PROJECT_VERSION }}"
            }
          ]
          }' ${{ secrets.WEBHOOK_URL }})
          echo "Webhook server response: $RESPONSE"
