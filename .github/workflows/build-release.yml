name: Build Release

on:
  workflow_dispatch:
    inputs:
      republish_bbb:
        description: 'Post to BuiltByBit even when the Hub already has this build (use to retry a failed BBB step)'
        type: boolean
        default: false
      republish_voxel:
        description: 'Post to Voxel.Shop even when the Hub already has this build (use to retry a failed Voxel.Shop step)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      JAVA_VERSION: '21'
      PROJECT_VERSION: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read version
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION=$(grep -Po 'baseVersion\s*=\s*"\K[^"]+' build.gradle.kts)
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

      # Two representations of the same changelog: `content` is the BBCode the file is
      # written in, for BuiltByBit's XenForo post; `content_html` is HTML for Voxel.Shop,
      # which stores update_description as HTML and does not parse BBCode (posting BBCode
      # there renders literal "[B]…[/B]" to buyers); `content_discord` is Markdown for the
      # Hub's Discord embed, and only the "Full changelog:" bullets — an embed description
      # is capped at 4096 characters and a whole changelog is most of that on its own, so
      # the prose sections stay on the store pages the announcement already links to.
      #
      # The conversion runs here, not in the Voxel.Shop step, so a changelog using a BBCode
      # tag the converters don't know fails the run *before* the tag push, the Hub upload
      # and both store posts. Nothing is published at that point, so fixing the changelog
      # (or the converter) and re-dispatching is clean — no republish flags needed. The
      # Discord converter fails the same way on an over-budget result, so a changelog too
      # long for the embed is caught here rather than reaching players cut off mid-sentence.
      - name: Read changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          CHANGELOG_FILE=".github/changelogs/${PROJECT_VERSION}.bbcode"
          if [[ -f "$CHANGELOG_FILE" ]]; then
            CHANGELOG_HTML=$(python3 .github/scripts/bbcode-to-html.py "$CHANGELOG_FILE")
            CHANGELOG_DISCORD=$(python3 .github/scripts/bbcode-to-discord.py "$CHANGELOG_FILE" \
              --from-heading 'Full changelog:')
            {
              echo 'content<<EOF'
              cat "$CHANGELOG_FILE"
              echo ""
              echo 'EOF'
              echo 'content_html<<EOF'
              echo "$CHANGELOG_HTML"
              echo 'EOF'
              echo 'content_discord<<EOF'
              echo "$CHANGELOG_DISCORD"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "content=Release ${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "content_html=<p>Release ${PROJECT_VERSION}</p>" >> "$GITHUB_OUTPUT"
            # Empty, not a placeholder: the Hub falls back to the commit-subject list, which
            # is a better announcement than the words "Release 4.0.2" on their own.
            echo "content_discord=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build MyPet
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BBB_SHARED_TOKEN: ${{ secrets.BBB_SHARED_TOKEN }}
        run: |
          ./gradlew --no-daemon --build-cache build -PbuildType=release

      # Skip if this release is already on Reposilite so a workflow re-run doesn't
      # trip over a redeploy rejection.
      - name: Publish API release to Reposilite
        env:
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          POM_URL="https://repo.userderezzed.dev/releases/de/keyle/mypet-api/${PROJECT_VERSION}/mypet-api-${PROJECT_VERSION}.pom"
          if curl -fsS --head -o /dev/null "$POM_URL"; then
            echo "mypet-api ${PROJECT_VERSION} already published; skipping."
          else
            ./gradlew --no-daemon :api:publish -PbuildType=release
          fi

      - name: Find JAR
        id: findjar
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/MyPet-${PROJECT_VERSION}.jar"
          if [[ ! -f "$JAR" ]]; then
            echo "Expected jar not found: $JAR" >&2
            ls -la build/libs || true
            exit 1
          fi
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Verify Hub secrets
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_UPLOAD_SECRET: ${{ secrets.HUB_UPLOAD_SECRET }}
        shell: bash
        run: |
          : "${HUB_URL:?HUB_URL secret is not set}"
          : "${HUB_UPLOAD_SECRET:?HUB_UPLOAD_SECRET secret is not set}"

      - name: Push release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          if EXISTING=$(git rev-parse -q --verify "refs/tags/${PROJECT_VERSION}"); then
            if [[ "$EXISTING" == "$GITHUB_SHA" ]]; then
              echo "Tag ${PROJECT_VERSION} already at ${GITHUB_SHA}; skipping."
              exit 0
            fi
            echo "Tag ${PROJECT_VERSION} exists at different commit ${EXISTING}" >&2
            exit 1
          fi
          git tag "$PROJECT_VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$PROJECT_VERSION"

      # The store steps used to gate on the Hub upload's `fresh` output, but the upload now runs
      # last so it can carry the store update ids. This read-only check replaces that signal.
      # A Hub that cannot be reached fails the job rather than defaulting either way: guessing
      # "new" risks re-notifying every subscriber, guessing "published" silently skips the
      # release.
      - name: Check MyPet Hub for this version
        id: hubcheck
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o "$RUNNER_TEMP/hub-versions.json" -w '%{http_code}' \
            "${HUB_URL}/api/v1/versions?channel=release")
          if [[ "$STATUS" != 2* ]]; then
            echo "Could not query the Hub for existing versions (HTTP $STATUS)" >&2
            cat "$RUNNER_TEMP/hub-versions.json" >&2 || true
            exit 1
          fi
          if jq -e --arg v "$PROJECT_VERSION" \
              '.versions[]? | select(.version == $v)' \
              "$RUNNER_TEMP/hub-versions.json" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Hub already lists ${PROJECT_VERSION}; a store post needs an explicit republish input."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Hub has no ${PROJECT_VERSION} yet."
          fi

      # Skipped when the Hub already lists this version, so a re-run can't double-post the BBB
      # update; dispatch with republish_bbb=true to retry a failed BBB post.
      - name: Publish version to BuiltByBit
        id: bbb
        if: steps.hubcheck.outputs.published == 'false' || inputs.republish_bbb
        continue-on-error: true
        env:
          BBB_API_TOKEN: ${{ secrets.BBB_API_TOKEN }}
          BBB_RESOURCE_ID: ${{ vars.BBB_RESOURCE_ID }}
          CHANGELOG: ${{ steps.changelog.outputs.content }}
        shell: bash
        run: |
          set -euo pipefail
          : "${BBB_API_TOKEN:?BBB_API_TOKEN secret is not set}"
          : "${BBB_RESOURCE_ID:?BBB_RESOURCE_ID repository variable is not set}"
          JAR="${{ steps.findjar.outputs.jar }}"

          # v2 creator update: jar goes base64-encoded inside the JSON body
          # (--rawfile, not --arg: the encoded jar exceeds the kernel's
          # per-argument size limit). Changelog becomes the public update post.
          base64 -w0 "$JAR" > "$RUNNER_TEMP/jar.b64"
          jq -n \
            --arg resource_id "$BBB_RESOURCE_ID" \
            --arg version "$PROJECT_VERSION" \
            --arg name "$(basename "$JAR")" \
            --rawfile data "$RUNNER_TEMP/jar.b64" \
            --arg title "MyPet $PROJECT_VERSION" \
            --arg message "$CHANGELOG" \
            '{
              resource_id: ($resource_id | tonumber),
              version_name: $version,
              file: {name: $name, data: $data},
              update: {post: true, title: $title, message: $message}
            }' > "$RUNNER_TEMP/bbb-payload.json"

          # Auth header form ("Token <...>") follows the only known working
          # client of this endpoint; verify against the response on first use.
          HTTP=$(curl -sS -o "$RUNNER_TEMP/bbb-response.json" -w '%{http_code}' \
            -X POST "https://api.builtbybit.com/v2/resources/creator/update" \
            -H "Authorization: Token ${BBB_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/bbb-payload.json")
          echo "BuiltByBit responded HTTP ${HTTP}:"
          cat "$RUNNER_TEMP/bbb-response.json"; echo

          if [[ "$HTTP" != 2* ]]; then
            echo "BuiltByBit update failed with HTTP $HTTP" >&2
            rm -f "$RUNNER_TEMP/jar.b64" "$RUNNER_TEMP/bbb-payload.json"
            exit 1
          fi

          # The update id is only needed to deep-link the Discord button, and BuiltByBit's
          # response shape is undocumented — the body is echoed above so the first real run
          # reveals it. Guessing wrong here costs a link, not a release: an empty id makes the
          # Hub fall back to the plain resource page.
          BBB_UPDATE_ID=$(jq -r '[.. | objects
                                   | (.update_id? // .updateId? // empty)] | first // empty' \
            "$RUNNER_TEMP/bbb-response.json" 2>/dev/null || true)
          if [[ -z "$BBB_UPDATE_ID" ]]; then
            echo "::warning::Could not find an update id in the BuiltByBit response;" \
                 "the Discord button will link to the resource page instead."
          else
            echo "BuiltByBit update id: ${BBB_UPDATE_ID}"
          fi
          echo "update_id=${BBB_UPDATE_ID}" >> "$GITHUB_OUTPUT"

          rm -f "$RUNNER_TEMP/jar.b64" "$RUNNER_TEMP/bbb-payload.json"

      # Skipped when the Hub already lists this version, so a re-run can't double-post the
      # Voxel.Shop update; dispatch with republish_voxel=true to retry a failed post.
      # Voxel.Shop signals rejection (duplicate version, missing "Post Updates"
      # permission) with HTTP 200 and response.success=false, so the body must be
      # parsed — under continue-on-error a status-only check would render a
      # non-publish as a green step.
      - name: Publish version to Voxel.Shop
        id: voxel
        if: steps.hubcheck.outputs.published == 'false' || inputs.republish_voxel
        continue-on-error: true
        env:
          VOXEL_API_TOKEN: ${{ secrets.VOXEL_API_TOKEN }}
          VOXEL_RESOURCE_ID: ${{ vars.VOXEL_RESOURCE_ID }}
          # HTML, not the BBCode BuiltByBit gets — see the "Read changelog" step.
          CHANGELOG_HTML: ${{ steps.changelog.outputs.content_html }}
        shell: bash
        run: |
          set -euo pipefail
          : "${VOXEL_API_TOKEN:?VOXEL_API_TOKEN secret is not set}"
          : "${VOXEL_RESOURCE_ID:?VOXEL_RESOURCE_ID repository variable is not set}"
          JAR="${{ steps.findjar.outputs.jar }}"

          # Voxel.Shop publishes in two requests: this POST creates the update row and hands
          # back a short-lived pre-signed URL, then the jar is PUT to that URL. The jar is
          # deliberately NOT sent here — the metadata call does not accept it.
          #
          # Field names come from Voxel.Shop being Polymart rebranded (its API errors report
          # /var/www/html/polymart/api/v1/api.php, and polymart.org redirects to voxel.shop).
          # doPostUpdate is undocumented, but MCReleaser's VoxelShopPlatform posts against this
          # same endpoint and uses `product`, `file_name`, `update_title`, `update_description`.
          # 4.0.1 was published with `resource_id`/`title`/`message`/`description` and no
          # `file_name` at all, which is why getResourceUpdates shows update 77152 with
          # title:null and description:null, and why the buyer's download came back named
          # "MyPet 4." — with no file name to serve, Polymart falls back to the resource title
          # ("MyPet 4") plus an empty extension. `resource_id` is kept alongside `product`
          # because it demonstrably routed 4.0.1 to the right resource; unrecognised form
          # fields are ignored, so sending both costs nothing.
          #
          # file_name is the ONLY place the jar's name is transmitted — the second request PUTs
          # raw bytes to a pre-signed URL that carries no filename. Dropping it silently
          # de-names the download.
          #
          # Verify after the next release with:
          #   curl -sS "https://api.voxel.shop/v1/getResourceUpdates?resource_id=<id>&stringify=0"
          # and check the newest update's title/description are no longer null.
          #
          # --form-string (not -F) for text fields, and mandatory here: the HTML changelog
          # always starts with '<', which -F would read as a file path.
          # stringify=0 makes response.success a real boolean instead of a string.
          STATUS=$(curl -sS -o "$RUNNER_TEMP/voxel-response.json" -w '%{http_code}' \
            -X POST "https://api.voxel.shop/v1/doPostUpdate?stringify=0" \
            --form-string "api_key=${VOXEL_API_TOKEN}" \
            --form-string "product=${VOXEL_RESOURCE_ID}" \
            --form-string "resource_id=${VOXEL_RESOURCE_ID}" \
            --form-string "version=${PROJECT_VERSION}" \
            --form-string "file_name=$(basename "$JAR")" \
            --form-string "update_title=MyPet ${PROJECT_VERSION}" \
            --form-string "update_description=${CHANGELOG_HTML}")

          if [[ "$STATUS" != 2* ]]; then
            echo "Voxel.Shop upload failed with HTTP $STATUS" >&2
            cat "$RUNNER_TEMP/voxel-response.json" >&2 || true
            exit 1
          fi

          if ! jq -e '.response.success == true' "$RUNNER_TEMP/voxel-response.json" >/dev/null; then
            echo "Voxel.Shop rejected the update:" >&2
            jq -r '.response.errors
                   | if type == "object" then to_entries[] | "  \(.key): \(.value)"
                     elif type == "array" then .[]
                     else . end' "$RUNNER_TEMP/voxel-response.json" >&2 || true
            exit 1
          fi

          # success:true here only means the update row exists — the jar has not been sent yet.
          UPDATE_ID=$(jq -r '.response.product.update // empty' "$RUNNER_TEMP/voxel-response.json")
          UPLOAD_URL=$(jq -r '.response.upload.url // empty' "$RUNNER_TEMP/voxel-response.json")
          MAX_SIZE=$(jq -r '.response.upload.max_size // empty' "$RUNNER_TEMP/voxel-response.json")

          if [[ -z "$UPLOAD_URL" || -z "$UPDATE_ID" ]]; then
            echo "Voxel.Shop reported success but returned no upload URL or update id:" >&2
            cat "$RUNNER_TEMP/voxel-response.json" >&2 || true
            exit 1
          fi

          # `fields` is null for a pre-signed PUT. A non-null value means Voxel.Shop switched to
          # a POST-policy form, which this step does not build — fail loudly rather than PUT into
          # an endpoint expecting multipart and call a silent no-op a success.
          if jq -e '.response.upload.fields != null' "$RUNNER_TEMP/voxel-response.json" >/dev/null; then
            echo "Voxel.Shop returned POST-policy upload fields, which this step cannot handle:" >&2
            jq -r '.response.upload.fields' "$RUNNER_TEMP/voxel-response.json" >&2 || true
            exit 1
          fi

          JAR_SIZE=$(wc -c < "$JAR" | tr -d ' ')
          if [[ -n "$MAX_SIZE" ]] && (( JAR_SIZE > MAX_SIZE )); then
            echo "Jar is ${JAR_SIZE} bytes, above Voxel.Shop's ${MAX_SIZE} byte limit." >&2
            exit 1
          fi

          # Second request: the jar itself, to the pre-signed URL. Only `host` is signed, so
          # curl's own headers don't invalidate the signature. The URL expires in ~20 minutes.
          UPLOAD_STATUS=$(curl -sS -o "$RUNNER_TEMP/voxel-upload.txt" -w '%{http_code}' \
            --upload-file "$JAR" "$UPLOAD_URL")
          if [[ "$UPLOAD_STATUS" != 2* ]]; then
            echo "Voxel.Shop jar upload failed with HTTP $UPLOAD_STATUS — update #${UPDATE_ID}" \
                 "exists but has no file:" >&2
            cat "$RUNNER_TEMP/voxel-upload.txt" >&2 || true
            exit 1
          fi

          echo "update_id=${UPDATE_ID}" >> "$GITHUB_OUTPUT"
          echo "Posted Voxel.Shop update #${UPDATE_ID} for version ${PROJECT_VERSION}" \
               "(${JAR_SIZE} bytes uploaded)"

      # `changelog` is the Markdown rendering of the changelog's "Full changelog:" bullets
      # and becomes the Discord embed's description; `commits` is still sent alongside it,
      # both for the record and because the Hub falls back to a commit-subject list when a
      # release has no changelog file.
      # 201 = fresh upload. 200 = the Hub already had this build from a previous run (same
      # version + commit) and re-announced on Discord if the first attempt failed. 409 = the
      # version exists from a *different* commit, so the Hub stores and announces nothing;
      # that is reported as a warning rather than failing the job, so the run still reaches
      # the store steps and the republish inputs can drive them.
      - name: Upload build to MyPet Hub
        id: hubupload
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_UPLOAD_SECRET: ${{ secrets.HUB_UPLOAD_SECRET }}
          # Through the environment, never inlined as ${{ }} into the script below: a
          # changelog contains double quotes and backticks, and an expression is substituted
          # into the bash source *before* the shell parses it, so inlining would break the
          # quoting and run `pet-config.yml` as a command substitution.
          CHANGELOG_DISCORD: ${{ steps.changelog.outputs.content_discord }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="${{ steps.findjar.outputs.jar }}"
          SHA512=$(sha512sum "$JAR" | cut -d' ' -f1)

          # Range anchor for the Discord change list: the nearest *ancestor* release tag.
          # `git describe` is used rather than a sorted `git tag -l` on purpose — tag creation
          # dates don't track branch history (3.14.3 was tagged after 4.0.0 and isn't even an
          # ancestor of v4), so a date sort anchors at the wrong release and lists the entire
          # branch. This step runs after "Push release tag", so the current version's own tag
          # already exists and has to be excluded.
          PREV_RELEASE_TAG=$(git describe --tags --abbrev=0 \
            --match '[0-9]*.[0-9]*.[0-9]*' \
            --exclude "$PROJECT_VERSION" --exclude '*-alpha-*' --exclude '*-beta-*' \
            --exclude '*SNAPSHOT*' HEAD 2>/dev/null || true)
          if [[ -n "$PREV_RELEASE_TAG" ]]; then
            RAW_COMMITS=$(git log --pretty='%h%x09%s' "${PREV_RELEASE_TAG}..${GITHUB_SHA}")
            # grep exits 1 when every commit is filtered out — an empty list is valid, and the
            # Hub falls back to the plain "MyPet <version>" embed when commits is empty.
            COMMITS=$(grep -viE '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]' \
              <<< "$RAW_COMMITS" || true)
          else
            COMMITS=""
          fi
          echo "Change list anchored at: ${PREV_RELEASE_TAG:-<none>} ($(grep -c '' <<< "$COMMITS") commits)"

          STATUS=$(curl -sS -o "$RUNNER_TEMP/hub-response.json" -w '%{http_code}' \
            -X POST "${HUB_URL}/api/v1/builds" \
            -H "Authorization: Bearer ${HUB_UPLOAD_SECRET}" \
            -F "jar=@${JAR}" \
            --form-string "version=${PROJECT_VERSION}" \
            --form-string "channel=release" \
            --form-string "commit=${GITHUB_SHA}" \
            --form-string "commits=${COMMITS}" \
            --form-string "changelog=${CHANGELOG_DISCORD}" \
            --form-string "bbbUpdateId=${{ steps.bbb.outputs.update_id }}" \
            --form-string "voxelUpdateId=${{ steps.voxel.outputs.update_id }}" \
            --form-string "commitUrl=${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}" \
            --form-string "sha512=${SHA512}" \
            --form-string "mcVersions=1.20.5-26.2")
          cat "$RUNNER_TEMP/hub-response.json"; echo
          case "$STATUS" in
            201) echo "fresh=true" >> "$GITHUB_OUTPUT" ;;
            200) echo "fresh=false" >> "$GITHUB_OUTPUT"
                 echo "Hub already has ${PROJECT_VERSION} from this commit (retry run)." ;;
            # Not fatal: a 409 means the Hub won't take this build, but the release itself is
            # real and the job must still reach the store steps so republish_bbb /
            # republish_voxel can drive them. Without an explicit flag they stay skipped, so a
            # 409 can never re-notify BuiltByBit or Voxel.Shop subscribers on its own.
            409) echo "fresh=false" >> "$GITHUB_OUTPUT"
                 echo "::warning::Hub already has ${PROJECT_VERSION} from a different commit and rejected this build (409). Nothing was stored and no Discord announcement was sent. Re-dispatch with republish_bbb / republish_voxel if the store posts still need to go out." ;;
            *)   echo "Hub upload failed with HTTP $STATUS" >&2; exit 1 ;;
          esac
