name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JAVA_VERSION: '25'
      PROJECT_VERSION: ""
      GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read version from build.gradle.kts
        id: ver
        shell: bash
        run: |
            VERSION=$(grep -Po 'version\s*=\s*"([^"]+)' build.gradle.kts | cut -d'"' -f2)
            echo "PROJECT_VERSION=$VERSION"
            echo "PROJECT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build MyPet
        run: |
          ./gradlew --no-daemon build -PbuildType=release -PSENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
        env:
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}

      # Source context (Java "source maps") is uploaded by the Sentry Gradle plugin during the
      # build above. This step creates and finalizes the matching release.
      - name: Finalize Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mypet
          SENTRY_PROJECT: mypet
        with:
          version: ${{ env.PROJECT_VERSION }}
          environment: production
          finalize: true
          set_commits: auto
          ignore_missing: true

      - name: Publish API release to Reposilite
        # A re-run after a later step failed must not stop here: release versions can't be
        # overwritten, so skip the publish when this version is already in the repository.
        run: |
          POM_URL="https://repo.userderezzed.dev/releases/de/keyle/mypet-api/${PROJECT_VERSION}/mypet-api-${PROJECT_VERSION}.pom"
          if curl -sfI "$POM_URL" > /dev/null; then
            echo "mypet-api ${PROJECT_VERSION} is already published, skipping"
          else
            ./gradlew --no-daemon :api:publish -PbuildType=release
          fi
        env:
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}

      - name: Find shaded JAR
        id: findjar
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          CANDIDATES=(build/libs/MyPet-*.jar)
          # Filter out sources/javadoc/plain jars
          FILTERED=()
          for j in "${CANDIDATES[@]}"; do
            [[ "$j" =~ -(sources|javadoc|plain)\.jar$ ]] || FILTERED+=("$j")
          done
          if (( ${#FILTERED[@]} == 0 )); then
            echo "No candidate jar found in build/libs" >&2
            ls -la build/libs || true
            exit 1
          fi
          JAR="${FILTERED[0]}"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$JAR")" >> "$GITHUB_OUTPUT"
          echo "Found: $JAR"

      - name: Upload workflow artifact (jar)
        uses: actions/upload-artifact@v4
        with:
          name: mypet-release-jar
          path: ${{ steps.findjar.outputs.jar }}
          if-no-files-found: error
          retention-days: 180

      - name: Read changelog
        id: changelog
        shell: bash
        run: |
          CHANGELOG_FILE=".github/changelogs/${PROJECT_VERSION}.md"
          if [[ -f "$CHANGELOG_FILE" ]]; then
            echo "Found changelog: $CHANGELOG_FILE"
            # The closing delimiter must start its own line, so end the content with a newline
            # even when the changelog file has none.
            DELIMITER="CHANGELOG_$(date +%s%N)"
            {
              echo "content<<${DELIMITER}"
              cat "$CHANGELOG_FILE"
              [[ -n "$(tail -c 1 "$CHANGELOG_FILE")" ]] && echo
              echo "${DELIMITER}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No changelog found at $CHANGELOG_FILE"
            echo "content=A changelog has not yet been uploaded. Please consider checking Discord!" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract supported NMS modules
        id: modules
        shell: bash
        run: |
          # Extract bukkitPackets from build.gradle.kts for update checker compatibility
          BUKKIT_PACKETS=$(grep -Po 'val bukkitPackets by extra\("([^"]+)"\)' build.gradle.kts | sed 's/.*("\(.*\)")/\1/')
          echo "list=$BUKKIT_PACKETS" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PROJECT_VERSION }}
          name: v${{ env.PROJECT_VERSION }}
          prerelease: false
          overwrite_files: false
          files: ${{ steps.findjar.outputs.jar }}
          body: |
            ${{ steps.changelog.outputs.content }}

            ---
            Supported NMS versions: ${{ steps.modules.outputs.list }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
