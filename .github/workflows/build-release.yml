name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      JAVA_VERSION: '21'
      PROJECT_VERSION: ""
      GAME_VERSIONS: ""
      GAME_VERSIONS_JSON: ""
      CHANGELOG: ""
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      USER_GITHUB: ${{ secrets.USER_GITHUB }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
      POLYMART_TOKEN: ${{ secrets.POLYMART_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Paperweight Dev Bundles
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/paperweight
            ~/.gradle/caches/VanillaGradle
          key: ${{ runner.os }}-paperweight-${{ hashFiles('nms/**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-paperweight-

      - name: Read version and game versions
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION=$(grep -Po 'baseVersion\s*=\s*"\K[^"]+' build.gradle.kts)
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

          # Extract Minecraft versions from MinecraftVersion.java enum constants
          MC_VERSION_FILE=api/src/main/java/de/Keyle/MyPet/api/util/MinecraftVersion.java
          GAME_VERSIONS=$(grep -oP '"\K\d+\.\d+(?:\.\d+)?(?=")' "$MC_VERSION_FILE")
          if [[ -z "$GAME_VERSIONS" ]]; then
            echo "ERROR: No Minecraft versions extracted from $MC_VERSION_FILE" >&2
            exit 1
          fi
          echo "GAME_VERSIONS<<EOF" >> "$GITHUB_ENV"
          echo "$GAME_VERSIONS" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

          # Create JSON array for Hangar platform_dependencies (compact single-line format)
          GAME_VERSIONS_JSON=$(echo "$GAME_VERSIONS" | jq -R . | jq -sc .)
          echo "GAME_VERSIONS_JSON=$GAME_VERSIONS_JSON" >> "$GITHUB_ENV"

      - name: Generate changelog
        shell: bash
        run: |
          set -euo pipefail
          # Get the previous release tag (non-prerelease)
          PREV_TAG=$(gh release list --limit 10 --exclude-pre-releases --json tagName -q '.[0].tagName' || echo "")
          if [[ -n "$PREV_TAG" && "$PREV_TAG" != "null" ]]; then
            CHANGELOG=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="${PROJECT_VERSION}" \
              -f target_commitish="${{ github.sha }}" \
              -f previous_tag_name="${PREV_TAG}" \
              -q '.body' || echo "Release ${PROJECT_VERSION}")
          else
            CHANGELOG="Initial release ${PROJECT_VERSION}"
          fi
          echo "CHANGELOG<<EOF" >> "$GITHUB_ENV"
          echo "$CHANGELOG" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Build MyPet
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          ./gradlew --no-daemon --build-cache build -PbuildType=release -PUSER_GITHUB=${USER_GITHUB} -PTOKEN_GITHUB=${TOKEN_GITHUB}

      - name: Find JAR
        id: findjar
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/MyPet-${PROJECT_VERSION}.jar"
          if [[ ! -f "$JAR" ]]; then
            echo "Expected jar not found: $JAR" >&2
            ls -la build/libs || true
            exit 1
          fi
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "Found: $JAR"

      - name: Upload workflow artifact (jar)
        uses: actions/upload-artifact@v4
        with:
          name: mypet-release-jar
          path: ${{ steps.findjar.outputs.jar }}
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PROJECT_VERSION }}
          name: v${{ env.PROJECT_VERSION }}
          generate_release_notes: true
          prerelease: false
          files: ${{ steps.findjar.outputs.jar }}

      - name: Publish to Hangar
        continue-on-error: true
        env:
          HANGAR_TOKEN: ${{ env.HANGAR_TOKEN }}
          HANGAR_CHANGELOG: ${{ env.CHANGELOG }}
        run: |
          ./gradlew --no-daemon publishPluginPublicationToHangar

      - name: Upload to Modrinth
        continue-on-error: true
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: SnE2iTno
          channel: release
          featured: true
          name: ${{ env.PROJECT_VERSION }}
          version: ${{ env.PROJECT_VERSION }}
          changelog: ${{ env.CHANGELOG }}
          loaders: paper
          game-versions: ${{ env.GAME_VERSIONS }}
          files: ${{ steps.findjar.outputs.jar }}

      - name: Upload to Polymart
        continue-on-error: true
        run: |
          ./gradlew --no-daemon createPolymartRelease \
            -PbuildType=release \
            -PPOLYMART_TOKEN=${POLYMART_TOKEN} \
            -PPOLYMART_VERSION=${PROJECT_VERSION} \
            -PPOLYMART_FILE=${{ steps.findjar.outputs.jar }}

      - name: Send a Discord webhook notification
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n \
            --arg version "$PROJECT_VERSION" \
            --arg changelog "$CHANGELOG" \
            --arg actor "${{ github.actor }}" \
            --arg actor_id "${{ github.actor_id }}" \
            '{
              username: "MyPet Release",
              content: "<@&1431929679626895450>",
              embeds: [
                {
                  type: "rich",
                  title: $version,
                  description: ("New release published\n\n" + $changelog),
                  color: 65280,
                  thumbnail: {
                    url: "https://raw.githubusercontent.com/MyPetORG/MyPet/master/.github/readme-images/logo.png"
                  },
                  author: {
                    name: $actor,
                    url: ("https://github.com/" + $actor),
                    icon_url: ("https://avatars.githubusercontent.com/u/" + $actor_id + "?v=4")
                  },
                  url: ("https://hangar.papermc.io/MyPet/MyPet/versions/" + $version)
                }
              ]
            }')
          RESPONSE=$(curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK_URL")
          echo "Webhook server response: $RESPONSE"