name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      JAVA_VERSION: '21'
      PROJECT_VERSION: ""
      GAME_VERSIONS: ""
      GAME_VERSIONS_JSON: ""
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read version and game versions
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION=$(grep -Po 'baseVersion\s*=\s*"\K[^"]+' build.gradle.kts)
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

          # Supported Minecraft versions for this build. Keep in sync with
          # the twin copy in build-alpha.yml / build-beta.yml and with the api-version floor
          # in plugin/src/main/resources/plugin.yml.
          GAME_VERSIONS=$(printf '%s\n' \
            1.20.5 \
            1.20.6 \
            1.21 \
            1.21.1 \
            1.21.2 \
            1.21.3 \
            1.21.4 \
            1.21.5 \
            1.21.6 \
            1.21.7 \
            1.21.8 \
            1.21.9 \
            1.21.10 \
            1.21.11)
          echo "GAME_VERSIONS<<EOF" >> "$GITHUB_ENV"
          echo "$GAME_VERSIONS" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

          # Create JSON array for Hangar platform_dependencies (compact single-line format)
          GAME_VERSIONS_JSON=$(echo "$GAME_VERSIONS" | jq -R . | jq -sc .)
          echo "GAME_VERSIONS_JSON=$GAME_VERSIONS_JSON" >> "$GITHUB_ENV"

      - name: Read changelog
        id: changelog
        shell: bash
        run: |
          CHANGELOG_FILE=".github/changelogs/${PROJECT_VERSION}.md"
          if [[ -f "$CHANGELOG_FILE" ]]; then
            echo "Found changelog: $CHANGELOG_FILE"
            {
              echo 'content<<EOF'
              cat "$CHANGELOG_FILE"
              echo ""
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "No changelog found at $CHANGELOG_FILE, using default message"
            echo "content=Release ${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build MyPet
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          ./gradlew --no-daemon --build-cache build -PbuildType=release

      - name: Publish API release to Reposilite
        run: ./gradlew --no-daemon :api:publish -PbuildType=release
        env:
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}

      - name: Find JAR
        id: findjar
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/MyPet-${PROJECT_VERSION}.jar"
          if [[ ! -f "$JAR" ]]; then
            echo "Expected jar not found: $JAR" >&2
            ls -la build/libs || true
            exit 1
          fi
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "Found: $JAR"

      - name: Upload workflow artifact (jar)
        uses: actions/upload-artifact@v4
        with:
          name: mypet-release-jar
          path: ${{ steps.findjar.outputs.jar }}
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PROJECT_VERSION }}
          name: v${{ env.PROJECT_VERSION }}
          prerelease: false
          files: ${{ steps.findjar.outputs.jar }}
          body: |
            ${{ steps.changelog.outputs.content }}

      - name: Publish to Hangar
        continue-on-error: true
        env:
          HANGAR_TOKEN: ${{ env.HANGAR_TOKEN }}
          HANGAR_CHANGELOG: ${{ steps.changelog.outputs.content }}
        run: |
          ./gradlew --no-daemon publishPluginPublicationToHangar

      - name: Upload to Modrinth
        continue-on-error: true
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: SnE2iTno
          channel: release
          featured: true
          name: ${{ env.PROJECT_VERSION }}
          version: ${{ env.PROJECT_VERSION }}
          changelog: ${{ steps.changelog.outputs.content }}
          loaders: paper
          game-versions: ${{ env.GAME_VERSIONS }}
          files: ${{ steps.findjar.outputs.jar }}

      - name: Send a Discord webhook notification
        env:
          FULL_CHANGELOG: ${{ steps.changelog.outputs.content }}
        run: |
          VERSION="${PROJECT_VERSION}"
          MODRINTH_URL="https://modrinth.com/plugin/mypet/version/${VERSION}"

          # Extract only the "Full changelog" section for Discord (after "### Full changelog:" or "## Full changelog:")
          CHANGELOG=$(echo "$FULL_CHANGELOG" | sed -n '/^##\?#\? Full [Cc]hangelog/,$p' | tail -n +2)

          # If no "Full changelog" section found, use the full changelog
          if [[ -z "$CHANGELOG" ]]; then
            CHANGELOG="$FULL_CHANGELOG"
          fi

          # Truncate changelog if it exceeds Discord's 4096 char limit
          if [[ ${#CHANGELOG} -gt 4000 ]]; then
            CHANGELOG="${CHANGELOG:0:3997}..."
          fi

          # Build JSON payload safely with jq
          PAYLOAD=$(jq -n \
            --arg version "$VERSION" \
            --arg changelog "$CHANGELOG" \
            --arg modrinth_url "$MODRINTH_URL" \
            '{
              content: ("MyPet **" + $version + "** has released!\n<@&1428362555084116131>"),
              embeds: [
                {
                  title: "Changelog",
                  description: $changelog,
                  color: 4429633,
                  fields: []
                },
                {
                  title: "Download from Modrinth",
                  url: $modrinth_url
                }
              ],
              components: [],
              username: "MyPet Release",
              avatar_url: "https://raw.githubusercontent.com/MyPetORG/MyPet/master/.github/readme-images/logo.png"
            }')

          RESPONSE=$(curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK_URL")
          echo "Webhook server response: $RESPONSE"