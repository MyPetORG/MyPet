name: Build Alpha

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      JAVA_VERSION: '21'
      BASE_PROJECT_VERSION: ""
      PROJECT_VERSION: ""
      BUILD_NUMBER: 0
      GAME_VERSIONS: ""
      GAME_VERSIONS_JSON: ""
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      USER_GITHUB: ${{ secrets.USER_GITHUB }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
      POLYMART_TOKEN: ${{ secrets.POLYMART_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read version and game versions
        shell: bash
        run: |
          set -euo pipefail
          BASE_PROJECT_VERSION=$(grep -Po 'baseVersion\s*=\s*"\K[^"]+' build.gradle.kts)
          echo "BASE_PROJECT_VERSION=$BASE_PROJECT_VERSION" >> "$GITHUB_ENV"

          # Supported Minecraft versions for this build. Keep in sync with
          # the twin copy in build-release.yml and with the api-version floor
          # in plugin/src/main/resources/plugin.yml.
          GAME_VERSIONS=$(printf '%s\n' \
            1.20.5 \
            1.20.6 \
            1.21 \
            1.21.1 \
            1.21.2 \
            1.21.3 \
            1.21.4 \
            1.21.5 \
            1.21.6 \
            1.21.7 \
            1.21.8 \
            1.21.9 \
            1.21.10 \
            1.21.11)
          echo "GAME_VERSIONS<<EOF" >> "$GITHUB_ENV"
          echo "$GAME_VERSIONS" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

          # Create JSON array for Hangar platform_dependencies (compact single-line format)
          GAME_VERSIONS_JSON=$(echo "$GAME_VERSIONS" | jq -R . | jq -sc .)
          echo "GAME_VERSIONS_JSON=$GAME_VERSIONS_JSON" >> "$GITHUB_ENV"

      - name: Ensure PR to master exists with release title
        continue-on-error: true
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: master
        shell: bash
        run: |
          set -euo pipefail
          : "${BASE_PROJECT_VERSION?Missing BASE_PROJECT_VERSION}"
          TITLE="Release (${BASE_PROJECT_VERSION})"

          # Skip if on base branch
          if [[ "$HEAD_BRANCH" == "$BASE_BRANCH" ]]; then
            echo "On $BASE_BRANCH; nothing to do."; exit 0
          fi

          OWNER_REPO="${GITHUB_REPOSITORY}"
          OWNER="${OWNER_REPO%%/*}"

          echo "Checking for existing open PR from $HEAD_BRANCH to $BASE_BRANCH"
          PR_NUMBER=$(gh pr list \
            --state open \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --json number \
            --jq '.[0].number' || true)

          if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; then
            PR_NUMBER=$(gh pr list \
              --state open \
              --base "$BASE_BRANCH" \
              --head "$OWNER:$HEAD_BRANCH" \
              --json number \
              --jq '.[0].number' || true)
          fi

          if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; then
            echo "No open PR found. Creating one with title: $TITLE"
            BODY=$(cat <<'EOF'
          This pull request was automatically created by the alpha build to keep master up to date with development.
          EOF
            )
            # Try unqualified head first, then qualified
            if ! gh pr create --base "$BASE_BRANCH" --head "$HEAD_BRANCH" --title "$TITLE" --body "$BODY"; then
              gh pr create --base "$BASE_BRANCH" --head "$OWNER:$HEAD_BRANCH" --title "$TITLE" --body "$BODY"
            fi
          else
            echo "Open PR #$PR_NUMBER exists. Ensuring title is set to: $TITLE"
            gh pr edit "$PR_NUMBER" --title "$TITLE" || echo "Warning: failed to update PR title"
          fi

      - name: Compute alpha BUILD_NUMBER from GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          : "${BASE_PROJECT_VERSION?Missing BASE_PROJECT_VERSION}"

          # List existing release tag names, strip quotes, and normalize optional leading 'v'
          LINES=$(gh release list --limit 200 --json tagName --jq '.[].tagName' | tr -d '"' || true)
          LINES=$(printf '%s\n' "$LINES" | sed -E 's/^v//' )

          # Match exact tags like "<version>-alpha-NN"
          CANDS=$(printf '%s\n' "$LINES" | grep -E "^${BASE_PROJECT_VERSION}-alpha-[0-9]+$" || true)
          NUMS=$(printf '%s\n' "$CANDS" | sed -E "s/^${BASE_PROJECT_VERSION}-alpha-([0-9]+)$/\1/" || true)
          MAX_B=$(printf '%s\n' "${NUMS:-}" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          [[ -z "${MAX_B:-}" ]] && MAX_B=0

          BUILD_NUMBER=$((MAX_B + 1))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          PROJECT_VERSION="${BASE_PROJECT_VERSION}-alpha-$(printf '%02d' $BUILD_NUMBER)"
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"
          echo "Building version: $PROJECT_VERSION"

      - name: Read changelog
        id: changelog
        shell: bash
        run: |
          CHANGELOG_FILE=".github/changelogs/${BASE_PROJECT_VERSION}-alpha.md"
          if [[ -f "$CHANGELOG_FILE" ]]; then
            echo "Found changelog: $CHANGELOG_FILE"
            {
              echo 'content<<EOF'
              cat "$CHANGELOG_FILE"
              echo ""
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "No changelog found at $CHANGELOG_FILE, using default message"
            echo "content=Alpha build. **Do NOT use in production!**" >> "$GITHUB_OUTPUT"
          fi

      - name: Build MyPet
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          ./gradlew --no-daemon --build-cache build -PbuildType=alpha -PBUILD_NUMBER=${BUILD_NUMBER} -PUSER_GITHUB=${USER_GITHUB} -PTOKEN_GITHUB=${TOKEN_GITHUB}

      - name: Publish API snapshot to Reposilite
        run: ./gradlew --no-daemon :api:publish -PbuildType=alpha
        env:
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}

      - name: Find JAR
        id: findjar
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/MyPet-${PROJECT_VERSION}.jar"
          if [[ ! -f "$JAR" ]]; then
            echo "Expected jar not found: $JAR" >&2
            ls -la build/libs || true
            exit 1
          fi
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "Found: $JAR"

      - name: Upload workflow artifact (jar)
        uses: actions/upload-artifact@v4
        with:
          name: mypet-alpha-jar
          path: ${{ steps.findjar.outputs.jar }}
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PROJECT_VERSION }}
          name: v${{ env.PROJECT_VERSION }}
          prerelease: true
          files: ${{ steps.findjar.outputs.jar }}
          body: |
            ${{ steps.changelog.outputs.content }}

      - name: Publish to Hangar
        continue-on-error: true
        env:
          HANGAR_TOKEN: ${{ env.HANGAR_TOKEN }}
          HANGAR_CHANGELOG: ${{ steps.changelog.outputs.content }}
        run: |
          ./gradlew --no-daemon publishPluginPublicationToHangar

      - name: Upload to Modrinth
        continue-on-error: true
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: SnE2iTno
          channel: alpha
          featured: false
          name: ${{ env.PROJECT_VERSION }}
          version: ${{ env.PROJECT_VERSION }}
          changelog: ${{ steps.changelog.outputs.content }}
          loaders: paper
          game-versions: ${{ env.GAME_VERSIONS }}
          files: ${{ steps.findjar.outputs.jar }}

      - name: Upload to Polymart
        continue-on-error: true
        run: |
          ./gradlew --no-daemon createPolymartRelease \
            -PPOLYMART_TOKEN=${POLYMART_TOKEN} \
            -PPOLYMART_VERSION=${PROJECT_VERSION} \
            -PPOLYMART_FILE=${{ steps.findjar.outputs.jar }}

      - name: Send a Discord webhook notification
        env:
          CHANGELOG: ${{ steps.changelog.outputs.content }}
        run: |
          VERSION="${PROJECT_VERSION}"
          MODRINTH_URL="https://modrinth.com/plugin/mypet/version/${VERSION}"

          # Truncate changelog if it exceeds Discord's 4096 char limit
          if [[ ${#CHANGELOG} -gt 4000 ]]; then
            CHANGELOG="${CHANGELOG:0:3997}..."
          fi

          # Build JSON payload safely with jq
          PAYLOAD=$(jq -n \
            --arg version "$VERSION" \
            --arg changelog "$CHANGELOG" \
            --arg modrinth_url "$MODRINTH_URL" \
            '{
              content: ("MyPet **" + $version + "** has released!\n<@&1431929679626895450>\n**Please test on development servers only.**\n**We may be unable to help resolve issues when using alpha builds on production servers!**"),
              embeds: [
                {
                  title: "Changelog",
                  description: $changelog,
                  color: 439741,
                  fields: []
                },
                {
                  title: "Download from Modrinth",
                  url: $modrinth_url
                }
              ],
              components: [],
              username: "MyPet Alpha",
              avatar_url: "https://raw.githubusercontent.com/MyPetORG/MyPet/master/.github/readme-images/logo.png"
            }')

          RESPONSE=$(curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK_URL")
          echo "Webhook server response: $RESPONSE"
