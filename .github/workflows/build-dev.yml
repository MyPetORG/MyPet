name: Build Dev

on:
  push:
    branches: [v4]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      JAVA_VERSION: '21'
      BASE_PROJECT_VERSION: ""
      PROJECT_VERSION: ""
      BUILD_NUMBER: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compute version from git tags
        shell: bash
        run: |
          set -euo pipefail
          BASE_PROJECT_VERSION=$(grep -Po 'baseVersion\s*=\s*"\K[^"]+' build.gradle.kts)
          echo "BASE_PROJECT_VERSION=$BASE_PROJECT_VERSION" >> "$GITHUB_ENV"

          # Highest existing dev-build tag for this base version → next NN
          MAX_B=$(git tag -l "${BASE_PROJECT_VERSION}-alpha-*" \
            | sed -E "s/^${BASE_PROJECT_VERSION}-alpha-0*([0-9]+)$/\1/" \
            | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          BUILD_NUMBER=$(( ${MAX_B:-0} + 1 ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          PROJECT_VERSION="${BASE_PROJECT_VERSION}-alpha-$(printf '%02d' $BUILD_NUMBER)"
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"
          echo "Building version: $PROJECT_VERSION"

          # Range anchor for the commit list: the last published alpha of this base
          # version, else the newest alpha tag of any version, else empty (first build).
          if (( ${MAX_B:-0} >= 1 )); then
            PREV_ALPHA_TAG=$(printf '%s-alpha-%02d' "$BASE_PROJECT_VERSION" "$MAX_B")
          else
            PREV_ALPHA_TAG=$(git tag -l '*-alpha-*' --sort=creatordate | tail -1 || true)
          fi
          echo "PREV_ALPHA_TAG=$PREV_ALPHA_TAG" >> "$GITHUB_ENV"
          echo "Commit list anchored at: ${PREV_ALPHA_TAG:-<none>}"

      - name: Ensure PR to master exists with release title
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: master
        shell: bash
        run: |
          set -euo pipefail
          : "${BASE_PROJECT_VERSION?Missing BASE_PROJECT_VERSION}"
          TITLE="Release (${BASE_PROJECT_VERSION})"

          if [[ "$HEAD_BRANCH" == "$BASE_BRANCH" ]]; then
            echo "On $BASE_BRANCH; nothing to do."; exit 0
          fi

          PR_NUMBER=$(gh pr list \
            --state open \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --json number \
            --jq '.[0].number' || true)

          if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; then
            BODY="This pull request was automatically created by the dev build to keep master up to date with development."
            gh pr create --base "$BASE_BRANCH" --head "$HEAD_BRANCH" --title "$TITLE" --body "$BODY"
          else
            gh pr edit "$PR_NUMBER" --title "$TITLE" || echo "Warning: failed to update PR title"
          fi

      - name: Build MyPet
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          ./gradlew --no-daemon --build-cache build -PbuildType=alpha -PBUILD_NUMBER=${BUILD_NUMBER}

      - name: Publish API snapshot to Reposilite
        run: ./gradlew --no-daemon :api:publish -PbuildType=alpha
        env:
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}

      - name: Find JAR
        id: findjar
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/MyPet-${PROJECT_VERSION}.jar"
          if [[ ! -f "$JAR" ]]; then
            echo "Expected jar not found: $JAR" >&2
            ls -la build/libs || true
            exit 1
          fi
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Verify Hub secrets
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_UPLOAD_SECRET: ${{ secrets.HUB_UPLOAD_SECRET }}
        shell: bash
        run: |
          : "${HUB_URL:?HUB_URL secret is not set}"
          : "${HUB_UPLOAD_SECRET:?HUB_UPLOAD_SECRET secret is not set}"

      - name: Push build tag
        shell: bash
        run: |
          set -euo pipefail
          git tag "$PROJECT_VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$PROJECT_VERSION"

      - name: Upload build to MyPet Hub
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_UPLOAD_SECRET: ${{ secrets.HUB_UPLOAD_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="${{ steps.findjar.outputs.jar }}"
          SHA512=$(sha512sum "$JAR" | cut -d' ' -f1)
          COMMIT_MESSAGE=$(git log -1 --pretty=%s "$GITHUB_SHA")
          if [[ -n "${PREV_ALPHA_TAG:-}" ]]; then
            RAW_COMMITS=$(git log --pretty='%h%x09%s' "${PREV_ALPHA_TAG}..${GITHUB_SHA}")
          else
            RAW_COMMITS=$(git log -1 --pretty='%h%x09%s' "${GITHUB_SHA}")
          fi
          # grep exits 1 when every commit is filtered out — an empty list is valid.
          COMMITS=$(grep -viE '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]' <<< "$RAW_COMMITS" || true)
          curl -fsS -X POST "${HUB_URL}/api/v1/builds" \
            -H "Authorization: Bearer ${HUB_UPLOAD_SECRET}" \
            -F "jar=@${JAR}" \
            --form-string "version=${PROJECT_VERSION}" \
            --form-string "channel=dev" \
            --form-string "commit=${GITHUB_SHA}" \
            --form-string "commitMessage=${COMMIT_MESSAGE}" \
            --form-string "commits=${COMMITS}" \
            --form-string "commitUrl=${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}" \
            --form-string "sha512=${SHA512}" \
            --form-string "mcVersions=1.20.5-26.2"
