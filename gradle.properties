# Gradle Build Performance Optimizations
# See: https://docs.gradle.org/current/userguide/build_environment.html

# Enable parallel builds - builds independent modules in parallel
org.gradle.parallel=true

# Enable Gradle daemon (should be default, but explicitly set)
org.gradle.daemon=true

# Increase memory for Gradle daemon
# Default is 512m, increasing to 2GB for better performance with multiple NMS modules
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Configuration cache - temporarily disabled due to script object serialization issues
# TODO: Re-enable after refactoring tasks to be configuration-cache compatible
# org.gradle.configuration-cache=true

# Enable build cache - reuses outputs from previous builds
org.gradle.caching=true

# Increase max parallel workers for better CPU utilization
# GitHub Actions has 2 cores, but hyperthreading allows 4 workers
# Adjust based on your local machine (e.g., 8 for an 8-core CPU)
org.gradle.workers.max=4

# Kotlin compiler optimization
kotlin.incremental=true

# Don't watch filesystem for changes (reduces CPU usage in some environments)
org.gradle.vfs.watch=false