# Gradle Build Performance Optimizations
# See: https://docs.gradle.org/current/userguide/build_environment.html
# Enable parallel builds - builds independent modules in parallel
org.gradle.parallel=true
# Enable Gradle daemon (should be default, but explicitly set)
org.gradle.daemon=true
# Daemon heap. 2 GB gives the daemon + shadowJar comfortable headroom for this 3-module build.
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# Configuration cache - significantly speeds up repeated builds
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# Enable build cache - reuses outputs from previous builds
org.gradle.caching=true
# Kotlin compiler optimization
kotlin.incremental=true
# Don't watch filesystem for changes (reduces CPU usage in some environments)
org.gradle.vfs.watch=false
