// Module configuration for Paper-based NMS modules using paperweight-userdev
// Note: The io.papermc.paperweight.userdev plugin and paperDevBundle should be configured in the individual module's build.gradle.kts

ext {
    // Determine if this version needs reobfuscation (1.17-1.20.4 need Spigot mappings, 1.20.5+ use Mojang)
    needsReobf = true
}

dependencies {
    compileOnly(project(':api'))
    compileOnly(project(':skills'))

    compileOnly("com.mojang:brigadier:1.0.18")
    compileOnly("com.mojang:datafixerupper:8.0.16")
    compileOnly("com.mojang:javabridge:1.2.24")
    compileOnly("com.mojang:authlib:3.2.38")

    compileOnly("net.kyori:adventure-api:4.25.0")
    compileOnly("net.kyori:adventure-text-minimessage:4.25.0")

    compileOnly("org.jetbrains:annotations:13.0")
    compileOnly("de.keyle:knbt:0.0.5")
}

// Configure paperweight-userdev
afterEvaluate {
    if (needsReobf) {
        // For Paper 1.17-1.20.4: reobfuscate to Spigot mappings for compatibility
        // The reobfJar task is automatically created by paperweight-userdev

        // Configure the runtimeElements configuration to use the reobfuscated JAR
        configurations.runtimeElements {
            outgoing {
                artifacts.clear()
                artifact(tasks.named('reobfJar'))
            }
        }
    } else {
        // For Paper 1.20.5+: use Mojang mappings (no reobfuscation needed)
        // Paper runtime uses Mojang mappings natively

        // Use the regular JAR with Mojang mappings
        configurations.runtimeElements {
            outgoing {
                artifacts.clear()
                artifact(tasks.named('jar'))
            }
        }
    }
}
