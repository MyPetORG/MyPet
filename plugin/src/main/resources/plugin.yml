name: MyPet
main: de.Keyle.MyPet.MyPetPlugin
version: "${mypetVersion}"
api-version: '1.20.5'
folia-supported: true
author: Keyle
libraries:
  - com.zaxxer:HikariCP:6.3.0
website: https://mypet.plugin.de/
softdepend:
  - BattleArena
  - BetterModel
  - Citizens
  - CombatLogX
  - FactionsUUID
  - GriefPrevention
  - Guilds
  - Heroes
  - ItemsAdder
  - Kingdoms
  - Lands
  - mcMMO
  - MobArena
  - ModelEngine
  - Multiverse-Core
  - My_Worlds
  - MythicMobs
  - packetevents
  - PlaceholderAPI
  - PlotSquared
  - PremiumVanish
  - ProtocolLib
  - PvPManager
  - RedProtect
  - Residence
  - SimpleClans
  - StackMob
  - SuperVanish
  - Towny
  - Vault
  - WorldGuard
permissions:
  MyPet.leash.*:
    description: Player can leash all Pet-Types.
  MyPet.command.trade.offer.*:
    description: Player offer all Pet-Types.
  MyPet.command.trade.receive.*:
    description: Player receive all Pet-Types.
  MyPet.admin:
    description: Grants all MyPet admin commands and capabilities.
    default: op
    children:
      MyPet.admin.editor: true
      MyPet.admin.reload: true
      MyPet.admin.ticket: true
      MyPet.admin.update: true
      MyPet.admin.clone: true
      MyPet.admin.create: true
      MyPet.admin.exp: true
      MyPet.admin.exprate: true
      MyPet.admin.info: true
      MyPet.admin.name: true
      MyPet.admin.npc: true
      MyPet.admin.purge: true
      MyPet.admin.remove: true
      MyPet.admin.respawn: true
      MyPet.admin.skilltree: true
      MyPet.admin.switch: true
      MyPet.command.info.other: true
      MyPet.command.list.other: true
      MyPet.command.skill.other: true
      MyPet.command.inventory.other: true
      MyPet.command.sendaway.other: true
      MyPet.admin.notify: true
      MyPet.bypass.skilltree: true
      MyPet.bypass.fee: true
      MyPet.bypass.death: true
      MyPet.bypass.inventory: true
      MyPet.bypass.creative: true
      MyPet.petstorage.limit.*: true
  MyPet.admin.editor: {description: "Use /mypet editor.", default: op}
  MyPet.admin.reload: {description: "Use /mypet reload.", default: op}
  MyPet.admin.ticket: {description: "Use /mypet ticket.", default: op}
  MyPet.admin.update: {description: "Use /mypet update.", default: op}
  MyPet.admin.clone: {description: "Use /petadmin clone.", default: op}
  MyPet.admin.create: {description: "Use /petadmin create.", default: op}
  MyPet.admin.exp: {description: "Use /petadmin exp.", default: op}
  MyPet.admin.exprate: {description: "Use /petadmin exprate.", default: op}
  MyPet.admin.info: {description: "Use /petadmin info.", default: op}
  MyPet.admin.name: {description: "Use /petadmin name.", default: op}
  MyPet.admin.npc: {description: "Use /petadmin npc.", default: op}
  MyPet.admin.purge: {description: "Use /petadmin purge.", default: op}
  MyPet.admin.remove: {description: "Use /petadmin remove.", default: op}
  MyPet.admin.respawn: {description: "Use /petadmin respawn.", default: op}
  MyPet.admin.skilltree: {description: "Use /petadmin skilltree.", default: op}
  MyPet.admin.switch: {description: "Use /petadmin switch.", default: op}
  MyPet.command.list.other: {description: "List other players' pets (/petlist <player>).", default: op}
  MyPet.command.skill.other: {description: "Edit other players' pet skills.", default: op}
  MyPet.command.inventory.other: {description: "Open other players' pet inventories.", default: op}
  MyPet.command.sendaway.other: {description: "Send away other players' pets.", default: op}
  MyPet.admin.notify:
    description: Receive web-editor apply notifications (changes applied via /mypet editor).
    default: op
  MyPet.bypass.skilltree:
    description: Bypass skilltree auto-assignment and the choose-only-once restriction.
    default: op
  MyPet.bypass.fee:
    description: Exempt from the skilltree switch fee.
    default: op
  MyPet.bypass.death:
    description: Exempt from release-on-death and backpack-drop-on-death.
    default: op
  MyPet.bypass.inventory:
    description: Open your own pet's backpack without MyPet.extended.inventory.
    default: op
  MyPet.bypass.creative:
    description: Use the pet backpack and pickup in Creative mode even when Backpack.OpenInCreative is disabled.
    default: op
  MyPet.petstorage.limit.*:
    description: Store the configured maximum number of pets (unlimited storage tier).
    default: op
  MyPet.player:
    description: Gives access to MyPet features for normal players.
    children:
      MyPet.leash.*: true
      MyPet.command.respawn: true
      MyPet.command.release: true
      MyPet.command.capturehelper: true
      MyPet.command.name: true
      MyPet.command.name.color: true
      MyPet.command.name.format: true
      MyPet.command.options: true
      MyPet.command.trade.offer.*: true
      MyPet.command.trade.receive.*: true
      MyPet.command.list: true
  MyPet.command.release:
    description: Allows usage of /petrelease
  MyPet.command.capturehelper:
    description: Gives access to the CaptureHelper
  MyPet.command.respawn:
    description: Allows usage of /petrespawn
  MyPet.command.name:
    description: Allows usage of /petname
  MyPet.command.name.color:
    description: Allows to use colors in petnames
  MyPet.command.name.format:
    description: Allows to use formatting tags (bold, italic, etc.) in petnames
  MyPet.command.options:
    description: Allows to use the MyPet options command
  MyPet.command.switch:
    description: Allows to switch between MyPets
  MyPet.command.store:
    description: Allows to store MyPets
  MyPet.command.info.other:
    description: Allows to view info about pets from other players with "/petinfo <playername>"
  MyPet.extended.feed:
    description: Extended permission. Allows to feed pets.
  MyPet.extended.equip:
    description: Extended permission. Allows to equip pets.
  MyPet.extended.beacon:
    description: Extended permission. Allows to open the beacon GUI.
  MyPet.extended.toolbox:
    description: Extended permission. Allows to open the pet's toolbox workstations.
  MyPet.extended.inventory:
    description: Extended permission. Allows to open the inventory of the pet.
  MyPet.extended.ride:
    description: Extended permission. Allows to mount pets.
  MyPet.extended.ride.fly:
    description: Extended permission. Allows to fly the pet while riding.
  MyPet.extended.control:
    description: Extended permission. Allows to control pets.
  MyPet.extended.pickup:
    description: Extended permission. Allows to enable pickup.
  MyPet.extended.behavior.friendly:
    description: Extended permission. Allows to use the ´friendly´ behavior.
  MyPet.extended.behavior.aggressive:
    description: Extended permission. Allows to use the ´aggressive´ behavior.
  MyPet.extended.behavior.farm:
    description: Extended permission. Allows to use the ´farm´ behavior.
  MyPet.extended.behavior.raid:
    description: Extended permission. Allows to use the ´raid´ behavior.
  MyPet.extended.behavior.duel:
    description: Extended permission. Allows to use the ´duel´ behavior.
  MyPet.experience.multiplier.125:
    description: Grants 25% extra experience.
  MyPet.experience.multiplier.150:
    description: Grants 50% extra experience.
  MyPet.experience.multiplier.175:
    description: Grants 75% extra experience.
  MyPet.experience.multiplier.200:
    description: Grants 100% extra experience.
  MyPet.experience.multiplier.225:
    description: Grants 125% extra experience.
  MyPet.experience.multiplier.250:
    description: Grants 150% extra experience.